<text x="40" y="52" class="m" font-size="12" letter-spacing="3" fill="#f5b942">FINANCIAL MODELLING</text>
<text x="38" y="96" class="t" font-size="32" font-weight="800" fill="#e6edf3">AGI <tspan font-weight="500" fill="#94a3b8" font-size="22">TSX: AFN</tspan></text>
<text x="40" y="138" class="t" font-size="18" fill="#94a3b8">Ag Growth International financials</text>
