<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#15223f"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd581"/><stop offset="1" stop-color="#e09a12"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
<radialGradient id="glow" cx=".82" cy=".35" r=".55"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".16"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect width="600" height="300" rx="18"/></clipPath>

</defs>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.fade{animation:fade .6s ease-out backwards}
@keyframes fade{from{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .7s ease-out backwards}@keyframes grow{from{transform:scaleY(0)}}
</style>
<g clip-path="url(#clip)">
<rect width="600" height="300" fill="url(#bg)"/>
<rect width="600" height="300" fill="url(#grid)"/>
<rect width="600" height="300" fill="url(#glow)"/>

<rect x="414" y="54" width="160" height="132" rx="12" fill="#0b1220" stroke="#ffffff" stroke-opacity=".1"/>
<path d="M414 78 H574 M454 54 V186" stroke="#ffffff" stroke-opacity=".08"/>
