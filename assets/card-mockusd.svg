<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#15223f"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd581"/><stop offset="1" stop-color="#e09a12"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
<radialGradient id="glow" cx=".82" cy=".35" r=".55"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".16"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect width="600" height="300" rx="18"/></clipPath>

</defs>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.fade{animation:fade .6s ease-out backwards}
@keyframes fade{from{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.spin{transform-origin:0 0;animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
<g clip-path="url(#clip)">
<rect width="600" height="300" fill="url(#bg)"/>
<rect width="600" height="300" fill="url(#grid)"/>
<rect width="600" height="300" fill="url(#glow)"/>

<g transform="translate(486 118)">
<circle r="74" fill="none" stroke="#f5b942" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 8" class="spin"/>
<circle r="58" fill="url(#gold)"/>
<circle r="50" fill="none" stroke="#7a4d00" stroke-opacity=".35" stroke-width="2"/>
<text y="9" text-anchor="middle" class="t" font-size="26" font-weight="800" fill="#3d2600">mUSD</text>
</g>
<text x="40" y="52" class="m" font-size="12" letter-spacing="3" fill="#f5b942">COMPANION CONTRACT</text>
<text x="38" y="96" class="t" font-size="32" font-weight="800" fill="#e6edf3">MockUSD</text>
<text x="40" y="138" class="t" font-size="18" fill="#94a3b8">Minimal ERC-20 token that mocks a</text>
<text x="40" y="163" class="t" font-size="18" fill="#94a3b8">stablecoin for testing the payment</text>
<text x="40" y="188" class="t" font-size="18" fill="#94a3b8">flows of InvoiceFactoring.</text>
<rect x="40" y="220" width="69" height="25" rx="12.5" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".45"/><text x="74.5" y="238" text-anchor="middle" class="m" font-size="13" fill="#2dd4bf">ERC-20</text><rect x="119" y="220" width="107" height="25" rx="12.5" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".45"/><text x="172.5" y="238" text-anchor="middle" class="m" font-size="13" fill="#2dd4bf">18 decimals</text><rect x="236" y="220" width="115" height="25" rx="12.5" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".45"/><text x="293.5" y="238" text-anchor="middle" class="m" font-size="13" fill="#2dd4bf">fixed supply</text>
<text x="560" y="276" text-anchor="end" class="t" font-size="14" font-weight="600" fill="#2dd4bf">View &#8594;</text>

</g>
<rect x=".5" y=".5" width="599" height="299" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
